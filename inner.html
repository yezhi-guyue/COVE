<!-- ============================================================
  inner.html · 走进来这一页
  样式：样式块那一整段里 分区都有注释
        （侧栏 顶部 导航 页脚 天气卡 星期条 心情弹层 足迹 中格三份 纸条 ……）
  脚本：下面 24 段 按出现顺序编号 搜开头那串符号加号码（如 07）就能跳到那一段
    01 禁系统手势缩放          02 天气卡鱼缸
    03 图标格大小名字底色       04 图标图跟着设置页走
    05 倒数日                  06 日历那一格的高度
    07 聊天入口占位文案       08 外面入口落盘换页
    09 纸条下沿两张小贴纸     10 洞洞板跟着便签走
    11 抽屉导航换页          12 鱼缸左上角文案
    13 星期条一到日          14 待办列表和弹层
    15 便签按行数撑高         16 主数据 hearth_v1（心情弹层 / 音乐播放器 / 封面 / 收藏）
    17 日记页日期引文         18 日记页行折叠
    19 整页缩放              20 墙上纸条的文字
    21 纸条上那两张固定贴纸   22 图标格背景
    23 小贴纸面板（拖贴 / 捏合改大小 / 最多五张）
    24 长按聊天卡片 换上面那个称呼

  足迹格子：没有脚本 只剩壳（样式 595-635 行，ul#eRollList 在 1481 行附近）
          留着重做，别往里塞逻辑
  规矩：新东西塞进对应的那一块 别随手往中间插 改完刷新看一遍
============================================================ -->

<!-- ══════ 01 · 禁掉系统手势缩放，页面只用自己的缩放 ══════ -->
<script>
(function(){
  function stop(e){ if(e.touches && e.touches.length>1){ e.preventDefault(); } }
  document.addEventListener('gesturestart',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('gesturechange',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('gestureend',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('touchmove',stop,{passive:false});
  document.addEventListener('dblclick',function(e){e.preventDefault();});
})();
</script>

<!-- ══════ 02 · 天气卡第三格·鱼缸：水草、鱼、气泡、追光 ══════ -->
        <script>
        (function(){
          var root = document.querySelector('.aq');
          if(!root) return;
          var box = root.querySelector('.aq-fish');
          var W = 376, H = 177;
          var NS = 'http://www.w3.org/2000/svg';

          function measure(){
            var r = root.getBoundingClientRect();
            if(r.width > 10){ W = r.width; H = r.height; }
          }
          measure();
          window.addEventListener('resize', measure);

          var SCOPE = {x0:-120, y0:-96, x1:516, y1:285};
          var insideCount = 8;
          var pool = [];


          function farScore(x, y, self){
            var m = 1e9;
            for(var i = 0; i < pool.length; i++){
              var o = pool[i];
              if(!o || o === self) continue;
              var d = (o.x - x)*(o.x - x) + (o.y - y)*(o.y - y);
              if(d < m) m = d;
            }
            return m;
          }

          function pickTarget(f, ax, ay, spread){
            if(ax != null){
              f.tx = ax + (Math.random()-.5)*(spread||70);
              f.ty = ay + (Math.random()-.5)*(spread||46);
            } else {
              if(f.swim == null) f.swim = Math.random() < .5 ? 1 : -1;
              var goOut = insideCount >= 5 && Math.random() < .10 && f.x > 16 && f.x < W - 16;
              if(goOut){
                var ox = f.swim > 0 ? W + 18 + Math.random()*72 : SCOPE.x0 + Math.random()*70;
                f.tx = ox; f.ty = f.y + (Math.random() - .5) * 44;
              } else {
                var COLS = 5, ROWS = 4;
                var cw = W / COLS, chh = H / ROWS;
                var cell = [];
                for(var ci = 0; ci < COLS * ROWS; ci++) cell.push(0);
                for(var oi = 0; oi < pool.length; oi++){
                  var op = pool[oi];
                  if(!op || op === f) continue;
                  var gx = Math.floor(op.x / cw), gy = Math.floor(op.y / chh);
                  if(gx >= 0 && gx < COLS && gy >= 0 && gy < ROWS) cell[gy*COLS + gx]++;
                }
                var bestG = -1, bestScore = -1e9;
                for(var gi = 0; gi < COLS * ROWS; gi++){
                  var gxx = gi % COLS, gyy = Math.floor(gi / COLS);
                  var px = (gxx + .5) * cw, py = (gyy + .5) * chh;
                  var ahead = (px - f.x) * f.swim;
                  if(ahead < 8) continue;
                  var sc0 = cell[gi] * -1000 + ahead * 0.6 + (Math.random() - .5) * 60;
                  if(sc0 > bestScore){ bestScore = sc0; bestG = gi; }
                }
                if(bestG < 0){
                  f.swim = -f.swim;
                  for(var gi2 = 0; gi2 < COLS * ROWS; gi2++){
                    var gx2 = gi2 % COLS, gy2 = Math.floor(gi2 / COLS);
                    var px2 = (gx2 + .5) * cw, py2 = (gy2 + .5) * chh;
                    var ahead2 = (px2 - f.x) * f.swim;
                    if(ahead2 < 8) continue;
                    var sc2 = cell[gi2] * -1000 + ahead2 * 0.6 + (Math.random() - .5) * 60;
                    if(sc2 > bestScore){ bestScore = sc2; bestG = gi2; }
                  }
                }
                if(bestG < 0) bestG = Math.floor(Math.random() * COLS * ROWS);
                var bgx = bestG % COLS, bgy = Math.floor(bestG / COLS);
                f.tx = (bgx + .5) * cw + (Math.random() - .5) * cw * .55;
                f.ty = (bgy + .5) * chh + (Math.random() - .5) * chh * .55;
              }
            }
            f.tx = Math.max(SCOPE.x0 + 12, Math.min(SCOPE.x1 - 12, f.tx));
            f.ty = Math.max(SCOPE.y0 + 12, Math.min(SCOPE.y1 - 12, f.ty));
            if(ax == null) f.zt = f.swim == null ? 0.15 + Math.random()*0.85 : 0.12 + Math.random()*0.9;
            f.timer = 0;
            f.leg = 7 + Math.random()*7;
          }

          var BODY = 'M62 15 C59.2 9.4 49.4 5.6 36.4 5.9 C26.4 6.1 17.8 9 12.2 13.4 '
                   + 'C11.6 13.9 11.6 16.1 12.2 16.6 C17.8 21 26.4 23.9 36.4 24.1 '
                   + 'C49.4 24.4 59.2 20.6 62 15 Z';
          var TAIL = 'M12.2 15 C9.2 10.4 5.6 5.6 1.6 3 C2.6 6.8 3.2 11 3.2 15 '
                   + 'C3.2 19 2.6 23.2 1.6 27 C5.6 24.4 9.2 19.6 12.2 15 Z';
          var FIN1 = 'M9.2 15 C7.6 12.2 5.8 8.8 4.6 5.8';
          var FIN2 = 'M9.2 15 C7.6 17.8 5.8 21.2 4.6 24.2';

          var SPEC = [
            [32,.72],[22,.88],[30,.7],[18,.5],
            [26,.9],[20,.32],[28,.56],[24,.2]
          ];

          var LANE_POS = [0.055, 0.185, 0.315, 0.445, 0.575, 0.705, 0.835, 0.955];

          var BX = [];
          for(var bxi = 62; bxi > 13; bxi -= 4) BX.push(bxi);
          BX.push(12.2);

          function bodyD(w){
            var d = '';
            var n = BX.length;
            var i, x, u, hh, dy;
            for(i = 0; i < n; i++){
              x = BX[i];
              u = (62 - x) / 49.8;
              if(u < 0) u = 0;
              if(u > 1) u = 1;
              hh = 9.2 * Math.pow(Math.sin(u * Math.PI), 0.7);
              if(u > 0.92 && hh < 1.5) hh = 1.5;
              dy = w * 4.2 * Math.sin(u * Math.PI * 2) * u;
              d += (i === 0 ? 'M' : ' L') + x.toFixed(1) + ' ' + (15 - hh + dy).toFixed(2);
            }
            for(i = n - 1; i >= 0; i--){
              x = BX[i];
              u = (62 - x) / 49.8;
              if(u < 0) u = 0;
              if(u > 1) u = 1;
              hh = 9.2 * Math.pow(Math.sin(u * Math.PI), 0.7);
              if(u > 0.92 && hh < 1.5) hh = 1.5;
              dy = w * 4.2 * Math.sin(u * Math.PI * 2) * u;
              d += ' L' + x.toFixed(1) + ' ' + (15 + hh + dy).toFixed(2);
            }
            return d + ' Z';
          }

          function applyDepth(f){
            if(f._z != null && Math.abs(f.z - f._z) < 0.06) return;
            f._z = f.z;
            var z = f.z; f.s = 0.55 + z*0.72;
            f.el.style.opacity = (0.24 + z*0.52).toFixed(2);
            /* 模糊只分两档 不再每帧重建一层 那才是最贵的地方 */
            var b = z < 0.4 ? 1 : 0;
            if(f._b !== b){
              f._b = b;
              f.el.style.filter = b ? 'blur(1px)' : 'none';
            }
            f.el.style.zIndex = String(Math.round(z*100));
          }

          var fish = SPEC.map(function(sp, idx){
            var n = sp[0], d = sp[1];
            var el = document.createElement('div');
            el.className = 'fsh';
            el.style.width = n + 'px';
            var z0 = d;
            el.style.opacity = (0.24 + z0*0.52).toFixed(2);
            el.style.filter = 'blur(' + (Math.pow(1-z0,1.6)*2.1).toFixed(2) + 'px)';
            el.style.zIndex = String(Math.round(z0*100));

            var svg = document.createElementNS(NS, 'svg');
            svg.setAttribute('viewBox', '0 0 64 30');
            svg.setAttribute('aria-hidden', 'true');

            var gT = document.createElementNS(NS, 'g');
            gT.setAttribute('class', 'tl');
            var gB = document.createElementNS(NS, 'g');
            gB.setAttribute('class', 'bd');

            var tail = document.createElementNS(NS, 'path');
            tail.setAttribute('d', TAIL);
            var fin1 = document.createElementNS(NS, 'path');
            fin1.setAttribute('class', 'fin');
            fin1.setAttribute('d', FIN1);
            var fin2 = document.createElementNS(NS, 'path');
            fin2.setAttribute('class', 'fin');
            fin2.setAttribute('d', FIN2);
            var body = document.createElementNS(NS, 'path');
            body.setAttribute('d', BODY);

            gT.appendChild(tail);
            gT.appendChild(fin1);
            gT.appendChild(fin2);
            gB.appendChild(body);
            svg.appendChild(gT);
            svg.appendChild(gB);
            el.appendChild(svg);
            box.appendChild(el);

            var f = {
              el: el, svg: svg, tail: gT, body: gB, bp: body,
              d: d, n: n, z: z0, zt: z0, s: 0.55 + z0*0.72,
              col: idx % 4,
              row: idx < 4 ? 0 : 1,
              idx: idx,
              lane: idx,
              ph0: idx / 8 + 0.0625, px: null,
              ftx: null, fty: null, fzt: 0.5,
              x: 20 + ((idx + 0.5) / 8) * (W - 40) + (Math.random() - .5) * 26,
              y: 18 + LANE_POS[idx] * (H - 34),
              ang: (idx % 2 === 0) ? 0 : Math.PI,
              swim: (idx % 2 === 0) ? 1 : -1,
              dir: 1,
              sp: (18 + Math.random()*11) * (0.68 + d*0.5),
              cur: 0,
              phase: Math.random()*6.28,
              freq: 1.6 + Math.random()*0.9,
              amp: 5.5 + Math.random()*4,
              wrig: 0.45 + Math.random()*1.05,
              boost: 0, timer: 0, leg: 3
            };
            f.dir = f.swim;
            f.cur = f.sp;
            f.ang = f.swim > 0 ? 0 : Math.PI;
            pool.push(f);
            return f;
          });
          var hold = null;

          for(var i = 0; i < 8; i++){
            var b = document.createElement('span');
            b.className = 'aq-bub';
            var sz = 2.2 + Math.random()*4.2;
            b.style.width = sz.toFixed(1) + 'px';
            b.style.height = sz.toFixed(1) + 'px';
            b.style.left = (4 + Math.random()*92).toFixed(1) + '%';
            b.style.animationDuration = (5.5 + Math.random()*8).toFixed(1) + 's';
            b.style.animationDelay = (-Math.random()*11).toFixed(1) + 's';
            root.appendChild(b);
          }

          function norm(a){
            while(a > Math.PI) a -= Math.PI * 2;
            while(a < -Math.PI) a += Math.PI * 2;
            return a;
          }

          var last = performance.now();
          var frame = 0;
          var lastDraw = 0;
          function loop(now){
            requestAnimationFrame(loop);
            if(document.hidden) return;
            if(now - lastDraw < 32) return;
            lastDraw = now;
            var dt = Math.min(0.05, (now - last) / 1000);
            last = now;
            var t = now / 1000;
            frame++;
            /* 不再在侧栏开合时让帧 那半秒跳帧就是卡顿感来源 */
            if((frame & 7) === 1){
              var ic = 0;
              fish.forEach(function(f){
                if(f.x > 6 && f.x < W - 6 && f.y > 6 && f.y < H - 6) ic++;
              });
              insideCount = ic;
            }

if(hold && !hold.on && now - hold.t > 210) hold.on = true;
            var holdOn = !!(hold && hold.on);

            fish.forEach(function(f){
              if(f.boost > .01) f.boost *= Math.pow(.945, dt*60);
              else f.boost = 0;
              f.z += ((holdOn ? 0.72 : f.zt) - f.z) * Math.min(1, dt*1.5);

              var want, diff;

              if(holdOn){
                var n = fish.length;
                var a2 = t * 0.82 + f.idx * (Math.PI * 2 / n);
                var tx = hold.x + Math.cos(a2) * 32;
                var ty = hold.y + Math.sin(a2) * 32;
                var dx = tx - f.x, dy = ty - f.y;
                var dist = Math.sqrt(dx*dx + dy*dy) || 1;
                want = Math.atan2(dy, dx);
                diff = norm(want - f.ang);
                f.ang += diff * Math.min(1, dt * 7);
                var spdH = Math.min(f.sp * 7, dist * 9);
                f.cur += (spdH - f.cur) * Math.min(1, dt*4);
                f.x += Math.cos(f.ang) * f.cur * dt;
                f.y += Math.sin(f.ang) * f.cur * dt;
                if(dist < 3){
                  f.x += (tx - f.x) * Math.min(1, dt*6);
                  f.y += (ty - f.y) * Math.min(1, dt*6);
                }
              } else {
                var outR = W + 30 + f.n, outL = -30 - f.n;
                var span = outR - outL;
                var T0 = span * 2 / 26;
                var p = f.ph0 + t / T0 + 0.015 * Math.sin(t * 0.22 + f.phase * 1.3);
                p = p - Math.floor(p);
                if(p < 0.5){ f.x = outL + (p / 0.5) * span; f.swim = 1; }
                else { f.x = outR - ((p - 0.5) / 0.5) * span; f.swim = -1; }
                var ly = 18 + LANE_POS[f.lane] * (H - 34) + Math.sin(t * 0.5 + f.phase) * (H * 0.02);
                f.y += (ly - f.y) * Math.min(1, dt * 1.3);
                f.zt = f.d;
                if(f.px == null) f.px = f.x;
                var vx = dt > 0 ? Math.abs(f.x - f.px) / dt : f.sp;
                if(vx > 70) vx = 70;
                f.px = f.x;
                f.cur += (vx - f.cur) * Math.min(1, dt * 4);
                want = f.swim > 0 ? 0 : Math.PI;
                diff = norm(want - f.ang);
                f.ang += diff * Math.min(1, dt * 3.4);
              }

              var want_dir = Math.cos(f.ang) >= 0 ? 1 : -1;
              f.dir += (want_dir - f.dir) * Math.min(1, dt*4);

              applyDepth(f);

              var rot = Math.sin(f.ang) * want_dir * 6;
              var squash = 1 - Math.min(.08, Math.abs(diff)*.12);

              f.el.style.transform = 'translate3d(' + f.x.toFixed(1) + 'px,' + f.y.toFixed(1) + 'px,0)'
                + ' translate(-50%,-50%) rotate(' + rot.toFixed(2) + 'deg) scale(' + f.s.toFixed(3) + ')';
              var st2 = 'scaleX(' + (f.dir < 0 ? -1 : 1) + ') scaleY(' + (Math.round(squash*40)/40) + ')';
              if(f._st !== st2){ f._st = st2; f.svg.style.transform = st2; }

              var tf = 1 + f.cur / 85;
              var ws = Math.sin(t*f.freq*tf + f.phase)
                    + Math.sin(t*f.freq*2.13*tf + f.phase*1.7) * 0.25;
              if((frame & 1) === 0 && !document.body.classList.contains('playing')) f.tail.setAttribute('transform', 'rotate(' + (ws*f.amp*f.wrig).toFixed(2) + ' 12.2 15)');
            });

          }
          requestAnimationFrame(loop);
        })();
        </script>

    <script>
    (function(){
      var nEl=document.getElementById('eNum'), fEl=document.getElementById('eFrom');
      var cEl=document.querySelector('.edays span');
      function today0(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
      function diffDay(iso){
        var p=String(iso).split('-');
        var t=new Date(+p[0],(+p[1])-1,+p[2]); t.setHours(0,0,0,0);
        return Math.round((t-today0())/86400000);
      }
      function dot(iso){
        var p=String(iso).split('-');
        if(p.length<3) return String(iso);
        return p[0]+'.'+p[1]+'.'+p[2];
      }
      var home=null;
      try{ home=JSON.parse(localStorage.getItem('hearth_home_cd')||'null'); }catch(e){ home=null; }
      if(home && home.date){
        var d=diffDay(home.date), up=(home.dir==='up');
        var val = up ? Math.max(0,-d) : Math.abs(d);
        var cap = up ? ((home.name||'')+'已经')
                     : ((d<0?'已经过':'距离')+(home.name||''));
        if(cEl) cEl.textContent=cap;
        if(nEl) nEl.textContent=val;
        if(fEl) fEl.textContent=(up?'起始日：':'目标日：')+dot(home.date);
      }else{
        var st='2025-12-08T00:00:00';
        try{ var s=JSON.parse(localStorage.getItem('hearth_v1')||'{}'); if(s&&s.start) st=s.start; }catch(e){}

<script>
/* 洞洞板跟着便签走：紧贴着便签下沿 宽度也跟它一样 */
(function(){
  var pb=document.getElementById('pb');
  var note=document.querySelector('.block.f .gote');
  var cell=document.querySelector('.block.f');
  if(!pb || !note) return;
  function place(){
    var g=pb.parentElement;
    var gr=g.getBoundingClientRect(), nr=note.getBoundingClientRect();
    if(!gr.width || !nr.width) return;
    var gap=Math.max(5, gr.height*0.035);
    var top=nr.bottom-gr.top+gap;
    var ref=(cell && cell.getBoundingClientRect().width) ? cell.getBoundingClientRect() : nr;
    var left=ref.left-gr.left;
    var w=ref.width;
    pb.style.left=left+'px';
    pb.style.right='auto';
    pb.style.width=w+'px';
    pb.style.top=top+'px';
    pb.style.bottom='0px';
    pb.style.height='auto';
    /* 孔洞按实际尺寸重排 横竖各一条线 边上不留半截孔 */
    var w=pb.clientWidth||0, h=pb.clientHeight||0;
    if(w>40 && h>40){
      var cols=Math.max(4, Math.round(w/24));
      var step=w/cols;
      var rows=Math.max(2, Math.floor(h/step));
      var offx=step/2, offy=(h-(rows-1)*step)/2;
      if(offy<offx) offy=offx;
      pb.style.backgroundSize=step.toFixed(2)+'px '+step.toFixed(2)+'px,100% 100%';
      pb.style.backgroundPosition=offx.toFixed(2)+'px '+offy.toFixed(2)+'px,0 0';
    }
  }
  requestAnimationFrame(place);
  window.addEventListener('load', place);
  setTimeout(place, 220); setTimeout(place, 700);
  window.addEventListener('resize', place);
  document.addEventListener('click', function(){ setTimeout(place,60); });
})();
</script>

  function rowEl(it, idx, isPop){

  }
  function render(){

      list.appendChild(rowEl(it,idx,false));

    var done=function(keep){

      if(keep && v) push(v);

        v=nid(v);
        for(var i=0;i<MOODS.length;i++){ if(MOODS[i][0]===v) return MOODS[i][1]; }

      };

  function nid(v){
    if(!v) return '';

           mood_annoy:'annoyed',mood_daze:'tired',mood_sad:'sad',mood_angry:'angry',

<script>
(function(){
  /* 整页放大缩小：双指捏合 / 桌面 ctrl+滚轮，比例自己记住 */
  var K='hearth_page_zoom';
  var z=1;
  try{ localStorage.removeItem(K); }catch(e){}
  function clamp(n){ return Math.min(1.6, Math.max(.75, n)); }
  function apply(save){
    z=1;
    document.documentElement.style.zoom=String(Math.round(z*1000)/1000);
    if(document.body) document.body.classList.toggle('pgf', z>1.001);
    if(save){ try{ localStorage.setItem(K, String(z)); }catch(e){} }
  }
  apply(true);
  window.__ZOOM=function(n){ z=n; apply(true); };
  window.__ZOOM_GET=function(){ return z; };

  var d0=0, z0=1;
  function dist(t){
    var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY;
    return Math.sqrt(dx*dx+dy*dy)||1;
  }
  document.addEventListener('touchstart', function(e){
    if(e.touches.length===2){ d0=dist(e.touches); z0=z; }
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if(e.touches.length===2 && d0>1){
      e.preventDefault();
      z=z0*(dist(e.touches)/d0);
      apply(false);
    }
  }, {passive:false});
  document.addEventListener('touchend', function(e){
    if(e.touches.length<2){ if(d0>1) apply(true); d0=0; }
  }, {passive:true});
  document.addEventListener('touchcancel', function(){ d0=0; }, {passive:true});

  window.addEventListener('wheel', function(e){
    if(!e.ctrlKey) return;
    e.preventDefault();
    z += (e.deltaY>0? -.08 : .08);
    apply(true);
  }, {passive:false});
})();

<script>
/* 贴纸：长按捏住能挪 只在纸条范围里挪 出一点边可以 跑不了太远 */
(function(){
  var box=document.querySelector('.block.f .gote') || document.querySelector('.gote');

  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ return {}; } }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var pos=load(), sup=false;
  var sbx=document.getElementById('fStick');
  var sts=[{el:document.getElementById('stickA'),k:'a'},{el:document.getElementById('stickB'),k:'b'}];

  function apply(){
    var sd=today();
    for(var i=0;i<sts.length;i++){

      if(!o.el) continue;

        if(p.gone===sd){ o.el.style.display='none'; continue; }
        delete pos[o.k]; save(pos); o.el.style.display=''; p=null;

      o.el.style.left=(typeof p.x==='object'?p.x.px:p.x)+'px';
      o.el.style.top=(typeof p.y==='object'?p.y.px:p.y)+'px';
    }
  }
  requestAnimationFrame(function(){ requestAnimationFrame(apply); });
  window.addEventListener('load', apply);
  setTimeout(apply, 220); setTimeout(apply, 700);

  function bind(o){
    var el=o.el; if(!el) return;
    var drag=false, pid=null, sx=0, sy=0, ox=0, oy=0;
    function inDrawer(ev){
      if(!sbx) return false;
      var q=sbx.getBoundingClientRect();
      return ev.clientX>=q.left-10 && ev.clientX<=q.right+10 && ev.clientY>=q.top-10 && ev.clientY<=q.bottom+10;
    }
    function stop(ev){
      if(!drag) return;
      drag=false; el.classList.remove('dragging');
      if(sbx) sbx.classList.remove('recall');

        pos[o.k]={gone:today()};

      var br=box.getBoundingClientRect(), r=el.getBoundingClientRect();
      var pad=Math.max(8, Math.min(br.width, br.height)*0.14);
      var maxX=br.width-r.width+pad, maxY=br.height-r.height+pad;
      var cx=Math.max(-pad, Math.min(maxX, r.left-br.left));
      var cy=Math.max(-pad, Math.min(maxY, r.top-br.top));
      var _o0=pos[o.k];
      var _mv=!_o0 || _o0.gone || Math.abs((_o0.x||0)-cx)>8 || Math.abs((_o0.y||0)-cy)>8;
      el.style.left=cx+'px'; el.style.top=cy+'px';
      pos[o.k]={x:Math.round(cx), y:Math.round(cy)};

      sup=true; setTimeout(function(){ sup=false; },300);
    }
    el.addEventListener('pointerdown', function(ev){
      if(ev.button && ev.button!==0) return;

      var br=box.getBoundingClientRect(), r=el.getBoundingClientRect();
      sx=ev.clientX; sy=ev.clientY; ox=r.left-br.left; oy=r.top-br.top; pid=ev.pointerId;

      try{ el.setPointerCapture(pid); }catch(e){}
    });
    el.addEventListener('pointermove', function(ev){

    },{passive:false});
    el.addEventListener('pointerup', function(ev){ ev.stopPropagation(); stop(ev); });

    el.addEventListener('contextmenu', function(ev){ ev.preventDefault(); });
  }
  bind(sts[0]); bind(sts[1]);

  /* 刚拖完那一下别当成点击 不弹提示 */

  }, true);
})();
</script>

<!-- ══════ 23 · 从小贴纸面板里长按一张 拖到墙上那张纸条上 贴住就留着 再拖回抽屉就收回 两指捏合改大小 ══════ -->
<script>
/* 从小贴纸面板里长按一张 拖到墙上那张纸条上 贴住就留着 再拖回抽屉就收回 两指捏合改大小 */
(function(){
  var KEY='cove_stuck_v1';
  var ZMIN=16, ZMAX=96;
  var MAX=5; /* 纸条上最多贴几张 */
  var sb=document.getElementById('fStick');
  var note=document.querySelector('.block.f .gote') || document.querySelector('.gote');
  if(!sb || !note) return;
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'[]')||[]; }catch(e){ return []; } }
  function save(a){ try{ localStorage.setItem(KEY, JSON.stringify(a)); }catch(e){} }
  var list=load();
  var owner=null;
  function clampZ(z){ return Math.max(ZMIN, Math.min(ZMAX, z)); }
  /* 贴满了：入口红一下 写一句提醒 然后就退回原样 */
  var tipTm=null;
  function tip(){
    var tx=sb.querySelector('.stx'); if(!tx) return;
    if(!tx._keep) tx._keep=tx.textContent;
    tx.textContent='最多贴'+MAX+'张';
    sb.classList.add('recall');
    clearTimeout(tipTm);
    tipTm=setTimeout(function(){ tx.textContent=tx._keep; sb.classList.remove('recall'); },1500);
  }
  function inBox(ev,r,pad){
    return ev.clientX>=r.left-pad && ev.clientX<=r.right+pad && ev.clientY>=r.top-pad && ev.clientY<=r.bottom+pad;
  }
  function place(img,o,ev,r){
    var xp=(ev.clientX-r.left)/r.width*100, yp=(ev.clientY-r.top)/r.height*100;
    xp=Math.max(3,Math.min(97,xp)); yp=Math.max(5,Math.min(95,yp));
    xp=Math.round(xp*10)/10; yp=Math.round(yp*10)/10;
    o.x=xp; o.y=yp;
    img.style.left=xp+'%'; img.style.top=yp+'%';
  }

  function hold(img,o){
    var tm=null, on=false, sx=0, sy=0;
    var ptrs={}, pinch=false, pd=0, pz=0;
    function cnt(){ var n=0; for(var k in ptrs) n++; return n; }
    function dist(){
      var a=null,b=null;
      for(var k in ptrs){ if(!a) a=ptrs[k]; else if(!b) b=ptrs[k]; }
      if(!a||!b) return 0;
      var dx=a[0]-b[0], dy=a[1]-b[1];
      return Math.sqrt(dx*dx+dy*dy);
    }
    /* 手指不用精确戳在这张小小的贴纸上 落在旁边一点点也算抓住了 */
    function near(x,y){
      var r=img.getBoundingClientRect();
      return x>=r.left-26 && x<=r.right+26 && y>=r.top-26 && y<=r.bottom+26;
    }
    function startPinch(){
      clearTimeout(tm); on=false;
      img.classList.remove('holding');
      sb.classList.remove('recall');
      pinch=true; pd=dist();
      pz=Math.round(img.getBoundingClientRect().width)||30;
      o.z=clampZ(pz); img.style.width=o.z+'px';
      img.classList.add('zooming');
    }
    img.addEventListener('click',function(e){ e.stopPropagation(); });
    img.addEventListener('pointerdown',function(e){ e.preventDefault(); e.stopPropagation(); });
    document.addEventListener('pointerdown',function(e){
      if(!img.isConnected) return;
      if(ptrs[e.pointerId]) return;
      if(cnt()===0){
        if(pinch) return;
        if(owner && owner!==img) return;
        if(!near(e.clientX,e.clientY)) return;
        owner=img;
        o._x0=o.x; o._y0=o.y;
      } else if(owner!==img) return;
      e.preventDefault();
      ptrs[e.pointerId]=[e.clientX,e.clientY];
      if(cnt()>=2){ startPinch(); return; }
      sx=e.clientX; sy=e.clientY;
      tm=setTimeout(function(){ on=true; img.classList.add('holding'); },300);
    },true);
    document.addEventListener('pointermove',function(ev){
      if(!ptrs[ev.pointerId] || owner!==img) return;
      ptrs[ev.pointerId]=[ev.clientX,ev.clientY];
      if(pinch){
        var d=dist(); if(!pd||!d) return;
        o.z=Math.round(clampZ(pz*d/pd));
        img.style.width=o.z+'px';
        return;
      }
      if(!on){
        if(Math.abs(ev.clientX-sx)>8 || Math.abs(ev.clientY-sy)>8) clearTimeout(tm);
        return;
      }
      place(img,o,ev,note.getBoundingClientRect());
      if(inBox(ev, sb.getBoundingClientRect(), 10)) sb.classList.add('recall');
      else sb.classList.remove('recall');
    },true);
    function end(ev){
      if(owner!==img) return;
      if(ptrs[ev.pointerId]) delete ptrs[ev.pointerId];
      clearTimeout(tm);
      if(pinch){
        if(cnt()<2){ pinch=false; img.classList.remove('zooming'); save(list); }
        return;
      }
      if(!on){ sb.classList.remove('recall'); if(cnt()===0) owner=null; return; }
      on=false; img.classList.remove('holding');
      sb.classList.remove('recall');
      if(inBox(ev, sb.getBoundingClientRect(), 10)){
        for(var i=0;i<list.length;i++){ if(list[i]===o){ list.splice(i,1); break; } }
        save(list);
        owner=null;
        img.style.transition='opacity .18s, transform .18s';
        img.style.opacity='0';
        setTimeout(function(){ if(img.parentNode) img.parentNode.removeChild(img); },200);
        return;
      }
      save(list);
      if(cnt()===0) owner=null;
    }
    document.addEventListener('pointerup',end,true);
    document.addEventListener('pointercancel',end,true);
  }

    function make(o){
    var img=document.createElement('img');
    img.className='gstick pasted';
    img.src=o.s;
    img.style.left=o.x+'%';
    img.style.top=o.y+'%';
    if(o.z) img.style.width=o.z+'px';
    img.style.transform='translate(-50%,-50%) rotate('+(o.r||0)+'deg)';
    img.onerror=function(){ this.style.display='none'; };
    note.appendChild(img);
    hold(img,o);
    return img;
  }
  function draw(){
    list=load();
    var old=note.querySelectorAll('img.pasted');
    for(var i=0;i<old.length;i++){ if(old[i].parentNode) old[i].parentNode.removeChild(old[i]); }
    for(var k=0;k<list.length;k++){ make(list[k]); }
  }
  function bind(el){
    var im=el.querySelector('img'); if(!im) return;
    var tm=null, started=false, ghost=null, sx=0, sy=0;
    el.addEventListener('pointerdown',function(e){
      if(!sb.classList.contains('open')) return;
      if(!im.src) return;
      sx=e.clientX; sy=e.clientY;
      try{ el.setPointerCapture(e.pointerId); }catch(_){}
      function start(){
        started=true; el.classList.add('hold');
        ghost=document.createElement('img');
        ghost.className='fgrab'; ghost.src=im.getAttribute('src');
        ghost.style.left=sx+'px'; ghost.style.top=sy+'px';
        document.body.appendChild(ghost);
        note.classList.add('dropping');
      }
      tm=setTimeout(start,300);
      function mv(ev){
        if(!started){ if(Math.abs(ev.clientX-sx)>8 || Math.abs(ev.clientY-sy)>8){ clearTimeout(tm); } return; }
        ghost.style.left=ev.clientX+'px';
        ghost.style.top=ev.clientY+'px';
      }
      function up(ev){
        clearTimeout(tm);
        el.removeEventListener('pointermove',mv);
        el.removeEventListener('pointerup',up);
        el.removeEventListener('pointercancel',up);
        if(!started) return;
        started=false;
        el._noTap=true;
        el.classList.remove('hold');
        note.classList.remove('dropping');
        if(ghost){
          var gh=ghost; ghost=null;
          gh.style.opacity='0';
          setTimeout(function(){ if(gh.parentNode) gh.parentNode.removeChild(gh); },150);
        }
        var r=note.getBoundingClientRect();
        if(!inBox(ev, r, 10)) return;
        if(list.length>=MAX){ tip(); return; }
        var o={s:im.getAttribute('src'), x:0, y:0, r:Math.round(Math.random()*16-8), z:30};
        place({style:{}}, o, ev, r);
        var img=make(o);
        img.style.transform='translate(-50%,-50%) rotate('+o.r+'deg)';
        list.push(o);
        save(list);
      }
      el.addEventListener('pointermove',mv);
      el.addEventListener('pointerup',up);
      el.addEventListener('pointercancel',up);
    });
  }
  window.__STUCK_DRAW=draw;
  var sks=sb.querySelectorAll('.sk');
  for(var i=0;i<sks.length;i++){ bind(sks[i]); }
  draw();
  setTimeout(draw, 600);
})();
</script>

  var local = '';

  function apply(){

  function flushNow(){
    try{ if(window.__LS_FLUSH) window.__LS_FLUSH(); }catch(e){}
  }
  /* 有外面那一层在 就把落盘交给它 它一直活着 不会被这页刷新砍断 也不跟这页抢着写同一个文件 */
  function relay(k, v){
    try{
      if(window.parent && window.parent !== window){
        window.parent.postMessage({ __coveLS:'set', k:k, v:v }, '*');
        return true;
      }
    }catch(e){}
    return false;
  }
  function keep(v){
    var raw = String(v);
    local = raw;
    if(relay(K, raw)) return;
    try{ localStorage.setItem(K, raw); }catch(e){}
    flushNow();
    setTimeout(function(){ if(!document.hidden) flushNow(); }, 1100);
    setTimeout(function(){ if(!document.hidden) flushNow(); }, 2400);
  }
  function edit(){
    var cur = nameEl() ? nameEl().textContent : DEF;
    var mask = document.createElement('div');
    mask.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.20);z-index:2147483002;display:flex;align-items:center;justify-content:center;';
    var card = document.createElement('div');
    card.style.cssText = 'min-width:232px;max-width:74vw;background:#FFFFFF;border-radius:16px;padding:18px 18px 12px;box-shadow:0 10px 34px rgba(0,0,0,.20);font-family:inherit;';
    var ttl = document.createElement('div');
    ttl.textContent = '换个称呼';
    ttl.style.cssText = 'font-size:12px;color:#8A8A8A;text-align:center;letter-spacing:.14em;margin-bottom:10px;';
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.value = cur;
    inp.maxLength = 12;
    inp.style.cssText = 'width:100%;box-sizing:border-box;border:0;border-radius:10px;padding:9px 10px;font-size:13px;letter-spacing:.06em;background:#F4F4F5;color:#3A3A3A;font-family:inherit;text-align:center;outline:none;';
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:10px;margin-top:14px;';
    var bc = document.createElement('button');
    bc.textContent = '取消';
    bc.style.cssText = 'flex:1;border:0;border-radius:10px;padding:9px 0;font-size:13px;letter-spacing:.1em;background:#F0F0F1;color:#666;font-family:inherit;';
    var bk = document.createElement('button');
    bk.textContent = '确定';
    bk.style.cssText = 'flex:1;border:0;border-radius:10px;padding:9px 0;font-size:13px;letter-spacing:.1em;background:#9E9EA3;color:#FFF;font-family:inherit;';
    row.appendChild(bc); row.appendChild(bk);
    card.appendChild(ttl); card.appendChild(inp); card.appendChild(row);
    mask.appendChild(card);
    document.body.appendChild(mask);
    function close(v){
      try{ document.body.removeChild(mask); }catch(e){}
      if(v === null) return;
      var t = String(v).replace(/[\s\u3000]+/g, ' ').trim();
      if(t.length > 12) t = t.slice(0, 12);
      if(!t) t = DEF;
      keep(t);
      var n = nameEl(); if(n) n.textContent = t;
      if(t !== cur){
        _fl(); setTimeout(_fl, 1100);
      }
    }
    bc.addEventListener('click', function(e){ e.stopPropagation(); close(null); });
    bk.addEventListener('click', function(e){ e.stopPropagation(); close(inp.value); });
    inp.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); close(inp.value); }
    });
    mask.addEventListener('click', function(e){ if(e.target === mask){ e.stopPropagation(); close(null); } });
    mask.addEventListener('touchstart', function(e){ e.stopPropagation(); }, {passive:true});
    setTimeout(function(){ try{ inp.focus(); inp.select(); }catch(e){} }, 60);
  }
  var hT = 0, hx = 0, hy = 0, killed = false;
  document.addEventListener('click', function(ev){
    if(!killed) return;
    var t = ev.target;
    if(t && t.closest && t.closest('#fChat')){
      ev.preventDefault(); ev.stopPropagation(); killed = false;
    }
  }, true);
  function hook(){
    var c = document.getElementById('fChat');
    if(!c) return;
    c.addEventListener('pointerdown', function(ev){
      if(ev.button && ev.button !== 0) return;
      hx = ev.clientX; hy = ev.clientY;
      clearTimeout(hT);
      hT = setTimeout(function(){
        hT = 0;
        killed = true;
        setTimeout(function(){ killed = false; }, 1400);
        try{ if(navigator.vibrate) navigator.vibrate(14); }catch(e){}
        edit();
      }, 480);
    });
    c.addEventListener('pointermove', function(ev){
      if(hT && (Math.abs(ev.clientX - hx) > 12 || Math.abs(ev.clientY - hy) > 12)){
        clearTimeout(hT); hT = 0;
      }
    }, {passive:true});
    c.addEventListener('pointerup', function(){ clearTimeout(hT); hT = 0; });
    c.addEventListener('pointercancel', function(){ clearTimeout(hT); hT = 0; });
    c.addEventListener('contextmenu', function(ev){ ev.preventDefault(); });
    apply();
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', hook);
  else hook();
  [0, 300, 1200, 2600].forEach(function(t){ setTimeout(apply, t); });
  window.addEventListener('load', function(){ setTimeout(apply, 400); });
  window.addEventListener('pageshow', apply);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) apply(); });
})();
</script>
